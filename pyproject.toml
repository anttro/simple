[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple"
version = "4.4.0"
description = "The pysim-free HTTP server for the SIMple PWA"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]
requires-python = ">=3.9"
# The runtime dependencies are pyscard, pycryptodomex and gsm0338
# (requirements.txt); the SCP81 TLS-PSK listener needs Python 3.13+.

[project.scripts]
simple-server = "simple_server.__main__:main"

[tool.setuptools.packages.find]
include = ["simple_server*"]

[tool.setuptools.package-data]
# The bundled MCC/MNC operator list (netmon's :func:`default_mcc_mnc_path`
# resolves it from the package directory) and its license - a wheel or an
# sdist-installed tree must carry them, not just the release zip.
simple_server = ["data/*.json", "data/*.LICENSE"]
